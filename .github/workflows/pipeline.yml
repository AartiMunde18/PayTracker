name: PayTrack Full Intership Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # --- STEP 1 : UNIT TESTS & INTEGRATION ---
  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Fix dubious ownership
        run: git config --global --add safe.directory ${{ github.workspace }}

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Database for Testing
        shell: powershell
        run: |
          docker-compose up -d db
          Start-Sleep -s 10

      - name: Exécution des tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/paytrack
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: ./mvnw test -Dspring.profiles.active=test

      - name: Stop Database
        if: always()
        run: docker compose stop db

  # --- STEP 2 : CODE QUALITY ---
  code_quality_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Linting (Checkstyle)
        run: ./mvnw checkstyle:check

  # --- STEP 3 : SECURITY (SAST) ---
  sast_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Security Scan (OWASP Dependency Check)
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: true

      - name: Verify Security Compliance
        shell: powershell
        run: |
          Write-Host "Vérification des résultats OWASP..."
          if (Test-Path "target/dependency-check-report.html") {
            Write-Host "Rapport OWASP généré avec succès"
          } else {
            Write-Host "Rapport OWASP non trouvé"
            exit 1
          }

  # --- STEP 4 : PACKAGING ---
  package_job:
    needs: [code_quality_job, sast_job]
    runs-on: ubuntu-latest
    steps:
      - name: Fix dubious ownership
        run: git config --global --add safe.directory ${{ github.workspace }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR with Maven
        run: ./mvnw package -DskipTests

      - name: Docker Build
        run: docker build -t paytrack_app:latest .

  # --- STEP 5 : CANARY (SMOKE TEST) ---
  canary_job:
    needs: package_job
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: canary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Canary Stack
        shell: powershell
        run: |
          # Nettoyage radical
          $canary = docker ps -aq -f name=paytrack-canary
          if ($canary) { docker rm -f paytrack-canary }

          # Création du réseau si nécessaire
          if (!(docker network ls --filter name=^paytrack_net$ -q)) {
              Write-Host "Création du réseau paytrack_net..."
              docker network create paytrack_net
          }

          # Lancement de l'infrastructure (DB et éventuellement Redis)
          docker compose up -d db
          Write-Host "Attente du démarrage des services (20s)..."
          Start-Sleep -s 20

          # Lancement du conteneur Canary
          docker run -d --name paytrack-canary `
            --network paytrack_net `
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/paytrack `
            -e SPRING_DATASOURCE_USERNAME=user `
            -e SPRING_DATASOURCE_PASSWORD=password `
            -e SPRING_PROFILES_ACTIVE=canary `
            -p 8081:8080 paytrack_app:latest

      - name: Health Check
        shell: powershell
        run: |
          Write-Host "Vérification de l'API sur le port 8081..."
          Start-Sleep -s 15
          try {
              $response = Invoke-RestMethod -Uri "http://localhost:8081/actuator/health" -Method Get
              Write-Host "L'API est stable ! Status: $($response.status)"
          } catch {
              Write-Host "--- ÉCHEC DU HEALTH CHECK : Logs de l'application ---"
              docker logs paytrack-canary
              exit 1
          }

      - name: Test API Endpoints
        shell: powershell
        run: |
          Write-Host "Test des endpoints API..."
          try {
              $health = Invoke-RestMethod -Uri "http://localhost:8081/actuator/health" -Method Get
              Write-Host "Health endpoint OK: $($health.status)"
          } catch {
              Write-Host "API endpoint test failed"
              exit 1
          }

      - name: Cleanup Canary
        if: always()
        shell: powershell
        run: |
          Write-Host "Nettoyage du test Canary..."
          if (docker ps -aq -f name=paytrack-canary) { docker rm -f paytrack-canary }

  # --- STEP 6 : DEPLOYMENT IN PRODUCTION ---
  deploy_prod_job:
    needs: canary_job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing containers
        shell: powershell
        run: |
          docker compose down
          if ($LASTEXITCODE -ne 0) { Write-Host "No containers to stop" }

      - name: Deploy Full Stack
        run: docker compose up -d --build

      - name: Verify Production Deployment
        shell: powershell
        run: |
          Write-Host "Waiting for services to be ready..."
          Start-Sleep -s 20
          try {
              $response = Invoke-RestMethod -Uri "http://localhost:8080/actuator/health" -Method Get
              Write-Host "Production deployment successful! Status: $($response.status)"
          } catch {
              Write-Host "Production deployment verification failed"
              exit 1
          }