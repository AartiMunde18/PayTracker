name: Import Issues from CSV
on:
  workflow_dispatch: # Permet de lancer manuellement l'import

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Issues
        uses: dsanchezcr/issue-importer-action@v1.0.0
        with:
          file-path: 'paytrack_github_issues_import.csv' # Chemin vers votre fichier
          file-format: 'csv'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: true # Passez à false après vérification