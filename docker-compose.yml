version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: paytrack-db
    environment:
      POSTGRES_DB: paytrack
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d paytrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paytrack_net

  redis:
    image: redis:7-alpine
    container_name: paytrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - paytrack_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paytrack-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paytrack
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - paytrack_net

volumes:
  postgres_data:

networks:
  paytrack_net:
    driver: bridge