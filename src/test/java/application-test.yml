spring:
datasource:
  url: jdbc:postgresql://localhost:5432/paytrack
  username: user
  password: password
  driver-class-name: org.postgresql.Driver
jpa:
  hibernate:
    ddl-auto: create-drop
  show-sql: false
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
flyway:
  enabled: true
  clean-disabled: false